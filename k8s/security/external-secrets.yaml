# ==========================================
# EXTERNAL SECRETS OPERATOR
# Synchronise AWS Secrets Manager → K8s Secrets
# ==========================================

# ==================== IAM Credentials pour ESO ====================
# Le secret aws-credentials est créé manuellement (jamais commité) :
#   kubectl create secret generic aws-credentials \
#     --namespace boutique \
#     --from-literal=access-key="$AWS_ACCESS_KEY_ID" \
#     --from-literal=secret-key="$AWS_SECRET_ACCESS_KEY"
# En prod : utiliser IRSA (IAM Roles for Service Accounts) à la place

---
# ==================== ClusterSecretStore ====================
# Connexion globale à AWS Secrets Manager
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: boutique
            key: access-key
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: boutique
            key: secret-key

---
# ==================== ExternalSecret ====================
# Tire le secret "prod/online-boutique/config" depuis AWS
# et le crée comme Secret K8s dans le namespace boutique
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boutique-config
  namespace: boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: boutique-config
    creationPolicy: Owner
  data:
  - secretKey: app_env
    remoteRef:
      key: prod/online-boutique/config
      property: app_env
  - secretKey: redis_password
    remoteRef:
      key: prod/online-boutique/config
      property: redis_password
  - secretKey: feature_flags
    remoteRef:
      key: prod/online-boutique/config
      property: feature_flags
