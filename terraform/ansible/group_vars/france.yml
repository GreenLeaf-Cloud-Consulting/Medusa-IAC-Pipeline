---
# Variables specific to France region

# Region configuration
aws_region: eu-west-3
is_primary_region: true

# Database configuration (France primary)
# Override with actual values from Terraform/AWS
database_url: "{{ lookup('env', 'FRANCE_DATABASE_URL') | default('postgres://medusa:medusa@localhost:5432/medusa_france', true) }}"
redis_url: "{{ lookup('env', 'FRANCE_REDIS_URL') | default('redis://localhost:6379', true) }}"

# CORS configuration
store_cors: "{{ lookup('env', 'FRANCE_STORE_CORS') | default('http://localhost:8000', true) }}"
admin_cors: "{{ lookup('env', 'FRANCE_ADMIN_CORS') | default('http://localhost:7001', true) }}"

# Environment
node_env: "{{ environment | default('production') }}"
