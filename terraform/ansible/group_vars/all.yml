---
# Common variables for all hosts

# System configuration
ansible_user: admin
system_timezone: UTC

# NVM and Node.js
nvm_version: "v0.39.7"
nodejs_version: "--lts"

# Docker
docker_compose_version: "v2.24.0"

# Medusa application
# Repository contenant à la fois l'infrastructure Terraform ET le code Medusa
# Utiliser HTTPS pour supporter les repos privés avec token
medusa_git_repo: "GreenLeaf-Cloud-Consulting/Medusa.git"
medusa_git_branch: "main"
medusa_app_dir: "/home/{{ ansible_user }}/medusa"

# GitHub token (chargé depuis variable d'environnement)
github_access_token: "{{ lookup('env', 'GITHUB_ACCESS_TOKEN') | default('') }}"

# Ports
medusa_backend_port: 9000
medusa_storefront_port: 8000

# Security (OVERRIDE THESE IN PRODUCTION!)
jwt_secret: "{{ lookup('env', 'MEDUSA_JWT_SECRET') | default('change-me-in-production', true) }}"
cookie_secret: "{{ lookup('env', 'MEDUSA_COOKIE_SECRET') | default('change-me-in-production', true) }}"

# Database (dynamically set in inventory by Terraform)
database_type: "postgres"
# database_url is set in inventory/hosts.yml (generated by Terraform)

# Redis
redis_url: "redis://redis:6379"

create_admin_user: true
medusa_admin_email: "admin@example.com"
medusa_admin_password: "supersecret123"

# CORS
store_cors: "http://localhost:8000"
admin_cors: "http://localhost:7001"

# Deployment flags
use_docker_deployment: true
deploy_storefront: true
build_storefront: true
run_migrations: true
