---
- name: Ensure .ssh directory exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Add GitHub to known hosts
  known_hosts:
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com') }}"
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
    state: present

# Clean up existing directory to ensure fresh clone (fixes 'not an empty directory' error)
- name: Remove existing Medusa directory
  file:
    path: "{{ medusa_app_dir }}"
    state: absent
  become: yes
  when:
    - medusa_app_dir is defined

# Clone avec HTTPS + Token pour les repos privés (si token présent)
- name: Clone Medusa repository (HTTPS with token)
  git:
    repo: "https://{{ github_access_token }}@github.com/{{ medusa_git_repo | regex_replace('^https://github.com/', '') | regex_replace('\\.git$', '') }}.git"
    dest: "{{ medusa_app_dir }}"
    version: "{{ medusa_git_branch }}"
    force: yes
  become_user: "{{ ansible_user }}"
  when:
    - github_access_token is defined
    - github_access_token | length > 0
  no_log: true

# Clone avec HTTPS Public (si pas de token)
- name: Clone Medusa repository (Public HTTPS)
  git:
    repo: "https://github.com/{{ medusa_git_repo | regex_replace('^https://github.com/', '') | regex_replace('\\.git$', '') }}.git"
    dest: "{{ medusa_app_dir }}"
    version: "{{ medusa_git_branch }}"
    force: yes
  become_user: "{{ ansible_user }}"
  when:
    - github_access_token is not defined or github_access_token | length == 0

# Ensure directory exists if git clone was skipped (Safety net)
- name: Ensure Medusa directory exists
  file:
    path: "{{ medusa_app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when:
    - medusa_app_dir is defined
