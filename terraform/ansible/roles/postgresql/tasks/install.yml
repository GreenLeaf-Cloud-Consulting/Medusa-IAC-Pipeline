---
# PostgreSQL Installation Tasks

- name: Wait for apt lock to be released
  shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 1; done
  become: yes
  changed_when: false
  timeout: 300

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install PostgreSQL and dependencies
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
      - acl
    state: present
  become: yes

- name: Ensure PostgreSQL is started and enabled
  systemd:
    name: postgresql
    state: started
    enabled: yes
  become: yes

- name: Get PostgreSQL version
  command: psql --version
  register: postgres_version
  changed_when: false
  become: yes
  become_user: postgres

- name: Display PostgreSQL version
  debug:
    msg: "PostgreSQL version: {{ postgres_version.stdout }}"

- name: Ensure PostgreSQL data directory has correct permissions
  file:
    path: /var/lib/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  become: yes

- name: Create Medusa database
  postgresql_db:
    name: "{{ postgresql_database }}"
    encoding: UTF-8
    lc_collate: C.UTF-8
    lc_ctype: C.UTF-8
    template: template0
  become: yes
  become_user: postgres
  when: db_type == 'primary'

- name: Create Medusa database user
  postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
    role_attr_flags: CREATEDB,NOSUPERUSER
  become: yes
  become_user: postgres
  when: db_type == 'primary'

- name: Grant privileges to Medusa user
  postgresql_privs:
    database: "{{ postgresql_database }}"
    privs: ALL
    type: database
    role: "{{ postgresql_user }}"
  become: yes
  become_user: postgres
  when: db_type == 'primary'
